name: Robot package CI

on:
  workflow_call:
    inputs:
      package_name:
        description: ament package / src folder name (job label, default codecov flag/name)
        required: true
        type: string
      ros_distro:
        description: ROS distro to build against (selects the osrf/ros image and setup.bash)
        required: false
        type: string
        default: "jazzy"
      gz_packages:
        description: space-separated Gazebo apt packages to install (empty skips the Gazebo apt repo entirely)
        required: false
        type: string
        default: "ros-jazzy-ros-gz ros-jazzy-gz-ros2-control"
      extra_apt_packages:
        description: extra space-separated apt packages to install alongside the base toolchain
        required: false
        type: string
        default: ""
      rosdep_skip_keys:
        description: space-separated rosdep --skip-keys (optional)
        required: false
        type: string
        default: "lucy_control_supervisor"
      repo_subpackages:
        description: the repo root holds several colcon packages as subdirectories, instead of being one package itself
        required: false
        type: boolean
        default: false
      build_packages:
        description: space-separated colcon packages to select for build/test (defaults to package_name alone)
        required: false
        type: string
        default: ""
      coverage_map:
        description: |
          one "pkg:relpath1,relpath2" entry per line, each relpath relative to src/<pkg>/.
          Defaults to "<package_name>:launch,test" (plus coverage_extra_paths) when empty.
        required: false
        type: string
        default: ""
      coverage_extra_paths:
        description: extra dirs under the package to cover (e.g. scripts); only used by the default coverage_map
        required: false
        type: string
        default: ""
      flags:
        description: codecov flags value (defaults to package_name)
        required: false
        type: string
        default: ""
      pytest_disable_plugin_autoload:
        description: isolate pytest plugins (needed when --cov + conflicting plugins)
        required: false
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  build-and-test:
    name: Build and test (${{ inputs.package_name }})
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:${{ inputs.ros_distro }}-desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set COLCON_WS
        run: |
          echo "COLCON_WS=$(cd "${GITHUB_WORKSPACE}/.." && pwd)/colcon_ws" >> "${GITHUB_ENV}"

      - name: Install tooling
        run: |
          set -e
          if [ -n "${{ inputs.gz_packages }}" ]; then
            sudo curl https://packages.osrfoundation.org/gazebo.gpg --output /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/gazebo-stable.list > /dev/null
          fi
          apt-get update && apt-get install -y --no-install-recommends \
            python3-rosdep \
            python3-pytest \
            python3-pytest-cov \
            python3-yaml \
            build-essential \
            cmake \
            git \
            ${{ inputs.gz_packages }} \
            ${{ inputs.extra_apt_packages }}
          # Do not rm -rf /var/lib/apt/lists/* here; rosdep uses apt next and needs indexes.
          rosdep init || true
          rosdep update

      - name: Workspace layout
        run: |
          set -e
          mkdir -p "${COLCON_WS}/src"
          if [ "${{ inputs.repo_subpackages }}" = "true" ]; then
            for pkg in ${{ inputs.build_packages }}; do
              cp -a "${GITHUB_WORKSPACE}/${pkg}" "${COLCON_WS}/src/${pkg}"
            done
          else
            cp -a "${GITHUB_WORKSPACE}" "${COLCON_WS}/src/${{ inputs.package_name }}"
          fi

      - name: rosdep install
        working-directory: ${{ env.COLCON_WS }}
        shell: bash
        run: |
          set -e
          apt-get update
          source /opt/ros/${{ inputs.ros_distro }}/setup.bash
          skip_keys=(${{ inputs.rosdep_skip_keys }})
          rosdep_args=(--from-paths src --ignore-src -r -y)
          if [ ${#skip_keys[@]} -gt 0 ]; then
            for key in "${skip_keys[@]}"; do
              [ -n "$key" ] || continue
              rosdep_args+=(--skip-keys="$key")
            done
          fi
          rosdep install "${rosdep_args[@]}"

      - name: colcon build
        working-directory: ${{ env.COLCON_WS }}
        shell: bash
        run: |
          source /opt/ros/${{ inputs.ros_distro }}/setup.bash
          select_pkgs="${{ inputs.build_packages }}"
          if [ -z "$select_pkgs" ]; then select_pkgs="${{ inputs.package_name }}"; fi
          colcon build --symlink-install \
            --packages-select $select_pkgs \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: colcon test
        working-directory: ${{ env.COLCON_WS }}
        shell: bash
        run: |
          source /opt/ros/${{ inputs.ros_distro }}/setup.bash
          source install/setup.bash
          if [ "${{ inputs.pytest_disable_plugin_autoload }}" = "true" ]; then
            export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          fi
          select_pkgs="${{ inputs.build_packages }}"
          if [ -z "$select_pkgs" ]; then select_pkgs="${{ inputs.package_name }}"; fi
          colcon test \
            --packages-select $select_pkgs \
            --event-handlers console_direct+ \
            --pytest-args "--tb=short -vv"

      - name: colcon test-result
        working-directory: ${{ env.COLCON_WS }}
        shell: bash
        run: |
          source /opt/ros/${{ inputs.ros_distro }}/setup.bash
          source install/setup.bash
          colcon test-result --verbose

      - name: Code coverage (pytest-cov)
        working-directory: ${{ env.COLCON_WS }}
        shell: bash
        if: success()
        run: |
          set -e
          source /opt/ros/${{ inputs.ros_distro }}/setup.bash
          source install/setup.bash
          if [ "${{ inputs.pytest_disable_plugin_autoload }}" = "true" ]; then
            export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          fi
          mkdir -p build/coverage_reports

          map="${{ inputs.coverage_map }}"
          if [ -z "$map" ]; then
            extra_cov=""
            for extra in ${{ inputs.coverage_extra_paths }}; do
              [ -n "$extra" ] || continue
              extra_cov="${extra_cov},${extra}"
            done
            map="${{ inputs.package_name }}:launch,test${extra_cov}"
          fi

          xmls=""
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            pkg="${line%%:*}"
            rest="${line#*:}"
            cov_args=()
            IFS=',' read -ra relpaths <<< "$rest"
            for rp in "${relpaths[@]}"; do
              [ -n "$rp" ] || continue
              cov_args+=(--cov="src/${pkg}/${rp}")
            done
            pytest_args=(src/"${pkg}"/test/)
            if [ "${{ inputs.pytest_disable_plugin_autoload }}" = "true" ]; then
              pytest_args+=(-p pytest_cov)
            fi
            python3 -m pytest "${pytest_args[@]}" \
              "${cov_args[@]}" \
              --cov-report="xml:build/coverage_reports/${pkg}.xml" \
              --cov-report="html:build/coverage_reports/html_${pkg}" \
              --cov-report=term-missing \
              --cov-branch
            xmls="${xmls:+$xmls,}${COLCON_WS}/build/coverage_reports/${pkg}.xml"
          done <<< "$map"
          echo "COVERAGE_XMLS=${xmls}" >> "${GITHUB_ENV}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        timeout-minutes: 3
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.COVERAGE_XMLS }}
          flags: ${{ inputs.flags != '' && inputs.flags || inputs.package_name }}
          name: ${{ inputs.package_name }}
          fail_ci_if_error: false

      - name: Upload coverage artifacts (XML + HTML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ inputs.package_name }}
          path: ${{ env.COLCON_WS }}/build/coverage_reports/
          retention-days: 14
